[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upigateways"
version = "1.0.0"
description = "Official Python SDK for UPI Gateways - Zero Transaction Fee (0% MDR) UPI Payment Infrastructure with instant bank settlement."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "UPI Gateways", email = "support@upigateways.in" }
]
keywords = [
  "upi",
  "payment-gateway",
  "india",
  "0-mdr",
  "razorpay-alternative",
  "cashfree-alternative",
  "paytm",
  "phonepe",
  "gpay",
  "bhim",
  "matrixpay",
  "upigateways"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale"
]

[project.urls]
Homepage = "https://www.upigateways.in"
Documentation = "https://www.upigateways.in/docs"
Repository = "https://github.com/ammireddy1998/matrixpay"

[tool.setuptools.packages.find]
where = ["src"]
